<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
	<link th:href="@{/css/productDetail.css}" rel="stylesheet">
</head>

	<header th:replace="~{header :: common_header}"></header>
	<div class="container">
		<h2 class="text-start">カート詳細画面</h2>
	<div th:each="item : ${cartList}">
	<div class="row">
		<div class="col-9">
				<div class="row">
					<div class="col-6">
						<div>
							<img class="product-image" th:src="@{${item.imagePath}}">
						</div>
					</div>
					<div class="col-6">
						<div>
							<div>
								<span>商品名：</span>
								<span name="productName" th:text="${item.productName}"></span>
							</div>
							<div>
								<span>数量：</span>
								<select class="form-select count-select">
									<option th:each="i : ${#numbers.sequence(1, item.stock)}" 
									        th:value="${i}" 
									        th:text="${i}"
											th:selected="${i == item.quantity}"></option>
								</select>
								<form th:action="@{/user/cart/delete}" method="post" class="d-inline">
								    <input type="hidden" name="cartId" th:value="${item.cartId}">
								    <input type="submit" class="btn btn-danger px-3 cart-btn" value="削除">
								</form>
							</div>
							<div>
								<span>価格：</span>
								<span th:text="${item.price}"></span>
							</div>
							<div>
								<span>消費税込み金額：</span>
								<span th:text="${item.includeTax}"></span>
							</div>
						</div>
					</div>
			</div>
		</div>
		<div class="col-3 border">
			<form th:action="@{/user/purchaseDetail}">
				<div>
					<span>カート内個数：</span>
					<span name="quantity" th:text="${item.quantity}"></span>
				</div>
				<div>
					<span>カート内金額：</span>
					<span name="price" th:text="${item.totalPrice}"></span>
				</div>
				<div>
					<span>カート内消費税込み金額：</span>
					<span name="includeTax" th:text="${item.totalIncludeTax}"></span>
				</div>
				<input type="hidden" name="productName" th:value="${item.productName}">
				<input type="hidden" name="price" th:value="${item.includeTax}">
				<input type="hidden" name="quantity" th:value="${item.quantity}">
				<input type="hidden" name="imagePath" th:value="${item.imagePath}">
				<input type="hidden" name="cartId" th:value="${item.cartId}">
				<input type="submit" class="btn btn-primary px-3 cart-btn" value="レジに進む">
			</form>
		</div>
	</div>	
</div>
	<footer th:replace="~{footer :: common_footer}"></footer>
</body>

</html>
