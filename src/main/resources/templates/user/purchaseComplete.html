<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
	<link th:href="@{/css/productDetail.css}" rel="stylesheet">
</head>

<body>
	<header th:replace="~{header :: common_header}"></header>
	<div class="container">
		<h2 class="text-start">購完了画面</h2>
		<div class="text-center">
			<h2>注文完了</h2>
		</div>
		<div>
			<span>画像：</span>
			<img class="product-image" th:src="@{${imagePath}}">
		</div>
		<div>
			<span>商品名：</span>
			<span th:text="${productName}"></span>
		</div>
		<div>
			<span>数量：</span>
			<span th:text="${quantity}"></span>
		</div>
		<div>
			<span>税込価格：</span>
			<span th:text="${price}"></span>
		</div>
		<div>
			<span>住所：</span>
			<span th:text="${fullAddress}"></span>
		</div>
		<div class="text-center">
			<a th:href="@{/user/top}" class="btn btn-primary px-3">TOP画面に戻る</a>
		</div>
	</div>

	<footer th:replace="~{footer :: common_footer}"></footer>
</body>

</html>
