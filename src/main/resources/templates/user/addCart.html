<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
	<link th:href="@{/css/productDetail.css}" rel="stylesheet">
</head>

	<header th:replace="~{header :: common_header}"></header>
	<div class="container">
		<h2 class="text-start">カート追加画面</h2>
	</div>
	<div class="container product-detail-erea">
		<form th:action="@{/user/purchaseDetail}">
			<div class="row">
				<div class="col-6">
					<img class="product-image" th:src="@{${product.imgPath}}">
				</div>
				<div class="col-6">
					<div>
						<span>商品名：</span>
						<span name="productName" th:text="${product.productName}"></span>
					</div>
					<div>
						<span>個数：</span>
						<span name="quantity" th:text="${quantity} + 個"></span>
					</div>
					<div>
						<span>カート内の合計：</span>
						<span name="totalPrice" th:text="${totalPrice} + 円"></span>
					</div>
				</div>
			</div>
			<input type="hidden" name="price" th:value="${price}">
			<input type="hidden" name="cartId" th:value="${cartId}">
			<input type="hidden" name="productName" th:value="${productName}">
			<input type="hidden" name="quantity" th:value="${quantity}">
			<div class="d-flex align-items-center w-100 mt-4">
				<div class="flex-fill text-start">
					<input type="submit" class="btn btn-primary px-3 cart-btn" value="レジに進む">
				</div>
			    <div class="flex-fill text-center">
			        <a th:href="@{/user/cartDeteil}" class="btn btn-primary px-3 cart-btn">カートに移動</a>
			    </div>

			    <div class="flex-fill text-end">
			        <a th:href="@{/user/top}" class="btn btn-primary px-3 cart-btn">TOP画面に戻る</a>
			    </div>
			</div>
		</form>

	</div>
	<footer th:replace="~{footer :: common_footer}"></footer>
</body>

</html>
