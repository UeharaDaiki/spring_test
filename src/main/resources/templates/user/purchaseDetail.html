<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
	<link th:href="@{/css/productDetail.css}" rel="stylesheet">
</head>

<body>
	<header th:replace="~{header :: common_header}"></header>
	<div class="container">
		<h2 class="text-start">購入詳細画面</h2>
	</div>

	<form th:action="@{/user/purchaseDetail}" method="post">
		<div class="container">
			<div class="row">
				<p>受け取り場所</p>
				<div class="col-2">
					<input type="radio" name="addressChoice" value="1">
				</div>
				<div class="col-10 border">
					<div>
						<span>名前：</span>
						<span th:text="${userName}"></span>
					</div>
					<div>
						<span>住所</span><br>
						<input type="text" class="form-control" placeholder="住所" name="address1">
					</div>
					<div>
						<span>アパート名等</span><br>
						<input type="text" class="form-control" placeholder="アパート名等" name="building1">
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-2">
					<input type="radio" name="addressChoice" value="2">
				</div>
				<div class="col-10 border">
					<div>
						<span>名前：</span>
						<span th:text="${userName}"></span>
					</div>
					<div>
						<span>住所</span><br>
						<input type="text" class="form-control" placeholder="住所" name="address2">
					</div>
					<div>
						<span>アパート名等</span><br>
						<input type="text" class="form-control" placeholder="アパート名等" name="building2">
					</div>
				</div>
			</div>
			<div class="row">
				<p>お支払情報</p>
				<div class="col-2">
					<input type="radio" name="cardChoice" value="1">
				</div>
				<div class="col-10 border">
					<div>
						<input type="text" class="form-control" placeholder="カード番号" name="cardNumber1">
					</div>
					<div>
						<input type="text" class="form-control" placeholder="有効期限 DD/YY" name="cardExpire1">
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-2">
					<input type="radio" name="cardChoice" value="1">
				</div>
				<div class="col-10 border">
					<div>
						<input type="text" class="form-control" placeholder="カード番号" name="cardNumber2">
					</div>
					<div>
						<input type="text" class="form-control" placeholder="有効期限 DD/YY" name="cardExpire2">
					</div>
				</div>
			</div>
			<input type="hidden" name="price" th:value="${price}">
			<input type="hidden" name="quantity" th:value="${quantity}">
			<input type="hidden" name="productName" th:value="${productName}">
			<input type="hidden" name="cartId" th:value="${cartId}">
			<input type="submit" class="btn btn-primary px-3 cart-btn" value="確認">
		</div>
	</form>
	<footer th:replace="~{footer :: common_footer}"></footer>
</body>

</html>
