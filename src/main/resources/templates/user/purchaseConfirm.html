<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
	<link th:href="@{/css/productDetail.css}" rel="stylesheet">
</head>

<body>
	<header th:replace="~{header :: common_header}"></header>
	<div class="container">
		<h2 class="text-start">購入確認画面</h2>
		<form th:action="@{/user/purchaseProcess}" method="post">
			<div>
				<span>名前：</span>
				<span th:text="${userName}"></span>
			</div>
			<div>
				<span>住所：</span>
				<span th:text="${address}"></span>
			</div>
			<div>
				<span>アパート名：</span>
				<span th:text="${building}"></span>
			</div>
			<div>
				<span>商品名：</span>
				<span th:text="${productName}"></span>
			</div>
			<div>
				<span>個数：</span>
				<span th:text="${quantity}"></span>
			</div>
			<div>
				<span>合計金額：</span>
				<span th:text="${totalPrice}"></span>
			</div>
			<div class="d-flex gap-3 mt-3">
				<a th:href="@{/user/purchaseDetail}" class="btn btn-danger px-3">編集</a>
				<th:block th:if="${cartId}">
					<input type="hidden" name="cartId" th:value="${cartId}">
				</th:block>
	
				<input type="submit" class="btn btn-primary px-3" name="purchase" value="購入">
			</div>
		</form>

	</div>
	<footer th:replace="~{footer :: common_footer}"></footer>
</body>

</html>
