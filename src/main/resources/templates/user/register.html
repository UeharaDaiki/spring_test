<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>新規登録</title>
</head>
<body>
	<div class="container">
		<h2 class="text-center">ユーザー新規登録画面</h2>
		<div class="mx-auto w-50">
		<form method="post" th:action="@{/user/register}" th:object="${userRegisterForm}">
			<label class="text-start">ユーザ名</label>
			<p><input type="text" th:field="*{userName}" class="form-control"/></p>
			<label>ユーザ名（カナ）</label>
			<p><input type="text" th:field="*{userNameKana}" class="form-control"/></p>
			<label>メールアドレス</label>
			<p><input type="email" th:field="*{email}" class="form-control"/></p>
			<label>パスワード</label>
			<p><input type="password" th:field="*{passwords}" class="form-control"/></p>
			<label>パスワード（確認用）</label>
			<p><input type="password" name="*{passwordConfirm}" class="form-control"/></p>
			<label>電話番号</label>
			<p><input type="tel" th:field="*{phone}" class="form-control"/></p>
			<label>住所</label>
			<p><input type="text" th:field="*{userAddress}" class="form-control"/></p>
			<div class="d-flex justify-content-between mt-4">
				<input type="submit" class="btn btn-primary" value="登録"/>
				<input type="button" class="btn btn-danger" value="戻る"/>
			</div>
		</form>
		</div>
	</div>
</body>
</html>
