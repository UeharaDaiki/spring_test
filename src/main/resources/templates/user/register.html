<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>新規登録</title>
</head>
<body>
	<div class="container">
		<h2 class="text-center">ユーザー新規登録画面</h2>
		<div class="mx-auto w-50">
		<form method="post" th:action="@{/user/register}" th:object="${userRegisterForm}">
			<div>
				<label class="text-start">ユーザ名</label>
				<div><input type="text" th:field="*{userName}" class="form-control"/></div>
				<div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="text-danger small"></div>
			</div>
			<label>ユーザ名（カナ）</label>
			<div><input type="text" th:field="*{userNameKana}" class="form-control"/></div>
			<div th:if="${#fields.hasErrors('userNameKana')}" th:errors="*{userNameKana}" class="text-danger small"></div>
			<label>メールアドレス</label>
			<div><input type="email" th:field="*{email}" class="form-control"/></div>
			<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
			<label>パスワード</label>
			<div><input type="password" th:field="*{passwords}" class="form-control"/></div>
			<div th:if="${#fields.hasErrors('passwords')}" th:errors="*{passwords}" class="text-danger small"></div>
			<label>パスワード（確認用）</label>
			<div><input type="password" name="*{passwordConfirm}" class="form-control"/></div>
			
			<label>電話番号</label>
			<div><input type="tel" th:field="*{phone}" class="form-control"/></div>
			<div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger small"></div>
			<label>住所</label>
			<div><input type="text" th:field="*{userAddress}" class="form-control"/></div>
			<div th:if="${#fields.hasErrors('userAddress')}" th:errors="*{userAddress}" class="text-danger small"></div>
			<div class="d-flex justify-content-between mt-4">
				<input type="submit" class="btn btn-primary" value="登録"/>
				<input type="button" class="btn btn-danger" value="戻る"/>
			</div>
		</form>
		</div>
	</div>
</body>
</html>
