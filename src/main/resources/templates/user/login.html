<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>新規登録</title>
</head>
<body>
	<div class="container">
		<h2 class="text-center">ログイン画面</h2>
		<div class="mx-auto w-50">
		<form method="post" th:action="@{/user/login}">
			<label>メールアドレス</label>
			<p><input type="email" name="username" class="form-control"/></p>
			<label>パスワード</label>
			<p><input type="password" name="password" class="form-control"/></p>
			<div class="d-flex justify-content-between mt-4">
				<input type="submit" class="btn btn-primary" value="login"/>
				<a class="btn btn-primary" th:href="@{/user/register}">新規登録</a>
			</div>
		</form>
		</div>
	</div>
</body>
</html>
