<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>新規登録</title>
	<link th:href="@{/css/header.css}" rel="stylesheet">
</head>

<body>
	<div class="p-3 align-items-center bg-dark text-white d-flex justify-content-between" th:fragment="common_header">
		<span class="card-header">
			Cytech EC.
		</span>
		<form class="d-flex gap-2" th:action="@{/user/search}">
			<input class="form-control search-input" type="text"name="keyword" th:value="${param.keyword}">
			<select class="form-select search-select" name="categoryId">
							<option value="">すべてのカテゴリ</option>
							<!-- 💖 DBから取得した categoryList をループ描画 -->
							<option th:each="category : ${categoryList}" 
							        th:value="${category.categoryId}" 
							        th:text="${category.categoryName}"
							        th:selected="${param.categoryId != null and #strings.equals(param.categoryId, category.categoryId)}">
							</option>
						</select>
			<input class="btn btn-dark px-3 btn-outline-light" type="submit" value="検索">
		</form>
		<div>
			<a th:href="@{/user/myPage}" class="btn btn-primary px-3">マイページ</a>
			<span class="text-start">ユーザー名：<span th:text="${loginUserName}"></span></span>
		</div>
	</div>
</body>

</html>
